name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-20.04

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/backend

    strategy:
      matrix:
        crystal: [ 1.14.0 ]

    env:
      MARTEN_ENV: test
      LIGO_DB_HOST: 127.0.0.1
      LIGO_DB_PORT: 3306
      LIGO_DB_USERNAME: root
      LIGO_DB_PASSWORD: root
      LIGO_DB_NAME: test_db

    steps:
      - name: Download source
        uses: actions/checkout@v2

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: "**/lib"
          key: ${{ runner.os }}-shards-${{ hashFiles('**/shard.lock') }}

      - name: Install shards
        run: shards check || shards install

      - name: Build app binary
        run: |
          mkdir bin
          # crystal build src/server.cr -o bin/server --release
          crystal build manage.cr -o bin/manage

      - name: Lint
        run: crystal tool format --check

      - name: Setup MySQL
        uses: shogo82148/actions-setup-mysql@v1
        with:
          distribution: "mariadb"
          mysql-version: "10.6"
          root-password: ${{ env.LIGO_DB_PASSWORD}}

      - name: Creating database
        run: |
          mysql -uroot -proot -e 'CREATE DATABASE ${{ env.LIGO_DB_NAME }};'

      - name: Run migration
        run: bin/manage migrate

      - name: Run Spec
        run: crystal spec
