name: CI

on:
  pull_request:
  push:
    branches: [ main, staging, 'deploy-*']

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  approval: 
    name: Workflow Approval
    runs-on: ubuntu-24.04
    if: |
      (github.ref_name == 'main' || startsWith(github.ref_name, 'deploy-')) &&
      github.actor != 'dependabot[bot]'
    outputs:
      approved: ${{ steps.approval_result.outputs.approved }}
      denied:   ${{ steps.approval_result.outputs.denied }}

    steps:
      - name: Extract PR/Commit Message
        id: extract_pr_commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            const msg = (commit.data?.commit?.message || '').trim();

            const prefixMatch = msg.match(/^(\[[^\]]*\]\s+[A-Z]+-[0-9]+)/);
            const prefix = prefixMatch ? prefixMatch[1] : '';

            const defaultTitle = `Ligo Production Deployment Approval`;
            core.setOutput('title',
              prefix ? `${prefix} - ${defaultTitle}` :
              msg ? `${msg} - ${defaultTitle}` :
              defaultTitle);              

      - name: Await Workflow Approval
        id: approval_step
        continue-on-error: true
        timeout-minutes: 2
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: adamnoto
          minimum-approvals: 1
          fail-on-denial: false
          issue-title: "${{ steps.extract_pr_commit.outputs.title }}"
          issue-body: |
            # 🚀 Ligo Production Deployment Approval
            
            ## 📋 Deployment Details
            | Field | Value |
            |-------|-------|
            | **Branch** | `${{ github.ref_name }}` |
            | **Commit** | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | **Triggered by** | @${{ github.actor }} |

            ## 🎯 Approval Process
            
            ### ✅ To Approve
            Comment with any of: `approved`, `approve`, `lgtm`, or `yes`
            
            ### ❌ To Deny  
            Comment with any of: `denied`, `deny`, or `no`
            
            >[!WARNING]
            >🌐 This will deploy to the **production** environment and affect live users.
            >📝 Please ensure you have reviewed all changes carefully before approving.

      - name: Determine approval result
        id: approval_result
        uses: actions/github-script@v7
        with:
          script: |
            const approvalOutcome = '${{ steps.approval_step.outcome }}';
            if (approvalOutcome !== 'success') {
              core.info(`Approval step outcome: ${approvalOutcome} — treating as not approved`);
              core.setOutput('approved', 'false');
              core.setOutput('denied', 'false');
              return;
            }

            const runId = String(process.env.GITHUB_RUN_ID);

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            const issue = issues.data.find(i => i.body && i.body.includes(`/actions/runs/${runId}`));
            if (!issue) {
              core.setOutput('approved','false');
              core.setOutput('denied','false');
              return { found: false };
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });

            const approvalKeywords = ['approved','approve','lgtm','yes'];
            const denialKeywords = ['denied','deny','no'];

            let approved = false;
            let denied = false;

            for (const c of comments.data) {
              const body = (c.body || '').trim().toLowerCase();
              const author = c.user?.login;
              if (author === 'adamnoto') {
                if (approvalKeywords.some(k => body.includes(k))) approved = true;
                if (denialKeywords.some(k => body.includes(k))) denied = true;
              }
            }

            if (!approved && !denied && issue.state === 'closed') denied = true;

            core.setOutput('approved', String(approved));
            core.setOutput('denied', String(denied));

  test:
    name: Run Tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/backend
    
    env:
      MARTEN_ENV: test
      LIGO_DB_HOST: 127.0.0.1
      LIGO_DB_PORT: 3306
      LIGO_DB_USERNAME: root
      LIGO_DB_PASSWORD: root
      LIGO_DB_NAME: ligo_test
      LIGO_S3_REGION: us-east-1
      LIGO_S3_BUCKET: ligo-uploaded-files-test
      LIGO_S3_ACCESS_KEY: test
      LIGO_S3_SECRET_KEY: test
      LIGO_S3_ENDPOINT: http://127.0.0.1:4566
      LIGO_S3_FORCE_PATH_STYLE: "true"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ligo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      mailcatcher:
        image: dockage/mailcatcher:0.9.0
        ports:
          - 1025:1025
          - 1080:1080
      localstack:
        image: localstack/localstack:3.7
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd="curl -f http://localhost:4566/_localstack/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    strategy:
      matrix:
        crystal: [ 1.16.3 ]

    steps:
      - name: Download source
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client pkg-config libvips-dev python3-pip
          pip3 install --user awscli-local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          awslocal --version

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: "**/lib"
          key: ${{ runner.os }}-shards-${{ hashFiles('**/shard.lock') }}

      - name: Update and install shards
        run: shards update && shards check || shards install

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h"127.0.0.1" -P"3306" -u"root" -p"root" --silent; do
            echo 'Waiting for mysqld to be connectable...'
            sleep 2
          done

      - name: Verify MySQL and database
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot -e \
            "SHOW DATABASES;"
          mysql -h127.0.0.1 -P3306 -uroot -proot -e \
            "SELECT User, Host, plugin FROM mysql.user WHERE User='root';"

          mysql -h127.0.0.1 -P3306 -uroot -proot -e \
            "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';"
          mysql -h127.0.0.1 -P3306 -uroot -proot -e \
            "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';"
          mysql -h127.0.0.1 -P3306 -uroot -proot -e \
            "FLUSH PRIVILEGES;"

          mysql -h127.0.0.1 -P3306 -uroot -proot -e \
            "SELECT User, Host, plugin FROM mysql.user WHERE User='root';"

      - name: Ensure test S3 bucket exists
        run: |
          awslocal s3api create-bucket \
            --bucket "$LIGO_S3_BUCKET" \
            --region "$LIGO_S3_REGION" || true
          awslocal s3 ls

      - name: Build app binaries
        run: |
          mkdir -p mybin
          crystal build manage.cr -o mybin/manage
          crystal build src/server.cr -o mybin/ligo-server --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ligo-binaries-${{ github.sha }}
          path: backend/mybin/
          retention-days: 1

      - name: Lint
        run: crystal tool format --check

      - name: Run migration
        run: |
          mybin/manage migrate
          mybin/manage migrate_system_fields

      - name: Run Spec
        run: crystal spec

  deploy:
    name: Ligo Deployment
    runs-on: ubuntu-24.04
    needs: [test, approval]
    if: >-
      ${{ needs.test.result == 'success' && 
      needs.approval.outputs.denied == 'false' &&
      needs.approval.outputs.approved == 'true' }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/backend

    env:
      MARTEN_ENV: production
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AZURE_IP: ${{ secrets.AZURE_IP }}
      AZURE_RG: ${{ secrets.AZURE_RG }}
      AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
      AZURE_USER: ${{ secrets.AZURE_USER }}
      PROD_PATH: ${{ secrets.PROD_PATH }}
      STAGE_PATH: ${{ secrets.STAGE_PATH }}
      LIGO_DB_ENV: ${{ secrets.LIGO_DB_ENV }}
      DEPLOY_BRANCH: ${{ github.ref_name }}

    strategy:
      matrix:
        ruby: [ 3.4.5 ]

    steps:
      - name: Download source
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ligo-binaries-${{ github.sha }}
          path: backend/mybin/

      - name: Prepare deployment binary
        run: |
          chmod +x mybin/ligo-server
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            cp mybin/ligo-server mybin/ligo-prod
          else
            cp mybin/ligo-server mybin/ligo-stage
          fi

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate temporary keys
        run: |
          ssh-keygen -t ed25519 -f ~/.ssh/deploy_key -N ""
          echo "PUBKEY=$(cat ~/.ssh/deploy_key.pub)" >> $GITHUB_ENV

      - name: Inject public key
        run: |
          az vm run-command invoke \
            -g ${{ secrets.AZURE_RG }} \
            -n ${{ secrets.AZURE_VM_NAME }} \
            --command-id RunShellScript \
            --scripts "mkdir -p \
              /home/${{ secrets.AZURE_USER }}/.ssh && \
              echo '${{ env.PUBKEY }} # github-actions' >> \
              /home/${{ secrets.AZURE_USER }}/.ssh/authorized_keys"

      - name: Setup ssh-agent
        run: |
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/deploy_key

      - name: Deploy to Production with Capistrano
        if: >-
          ${{ github.ref_name == 'main' || 
          startsWith(github.ref_name, 'deploy-') }}
        run: |
          cd ${{ github.workspace }}/deployer
          bundle install
          cap production deploy

      - name: Deploy to Staging with Capistrano
        if: ${{ github.ref_name == 'staging' }}
        run: |
          cd ${{ github.workspace }}/deployer
          bundle install
          cap staging deploy

      - name: Cleanup public key
        if: always()
        run: |
          az vm run-command invoke \
            -g ${{ secrets.AZURE_RG }} \
            -n ${{ secrets.AZURE_VM_NAME }} \
            --command-id RunShellScript \
            --scripts "grep -v '# github-actions' \
              /home/${{ secrets.AZURE_USER }}/.ssh/authorized_keys > \
              /tmp/ak && mv /tmp/ak \
              /home/${{ secrets.AZURE_USER }}/.ssh/authorized_keys"
