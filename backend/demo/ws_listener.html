<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Antrikan Channel Listener WS Demo</title>
  <style>
    body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 0 10px; }
    h1 { font-size: 16px; }
    label { display: block; margin-top: 8px; font-weight: bold; }
    input { width: 100%; padding: 4px; font-family: monospace; margin-bottom: 4px; }
    button { padding: 6px 16px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 10px; max-height: 400px; overflow-y: auto; font-size: 12px; border: 1px solid #ddd; }
    .status { padding: 4px 0; }
    .connected { color: green; }
    .disconnected { color: red; }
  </style>
</head>
<body>
  <h1>Antrikan WebSocket Demo</h1>

  <label>Ligo Port</label>
  <input id="port" type="text" placeholder="8000">

  <label>JWT Token</label>
  <input id="token" type="text" placeholder="eyJhbGciOiJIUzI1NiIs...">

  <label>Channel Hash ID</label>
  <input id="channel" type="text" placeholder="ABC123DEF456">

  <button id="connectBtn" onclick="toggleConnection()">Connect</button>
  <span id="status" class="status disconnected">Disconnected</span>

  <h3>Events</h3>
  <pre id="output"></pre>

  <script>
    var ws = null;
    var reconnectTimer = null;

    function log(msg) {
      var out = document.getElementById("output");
      var time = new Date().toISOString().split("T")[1].split(".")[0];
      out.textContent += "[" + time + "] " + msg + "\n";
      out.scrollTop = out.scrollHeight;
    }

    function setStatus(text, cls) {
      var el = document.getElementById("status");
      el.textContent = text;
      el.className = "status " + cls;
    }

    function toggleConnection() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
        return;
      }
      connect();
    }

    function connect() {
      var port = document.getElementById("port").value.trim();
      var token = document.getElementById("token").value.trim();
      var channel = document.getElementById("channel").value.trim();

      if (!port) {
        log("ERROR: Please fill in Ligo port");
        return;
      }

      if (!token || !channel) {
        log("ERROR: Please fill in JWT token and channel hash ID");
        return;
      }

      if (ws) {
        ws.onclose = null;
        ws.close();
      }

      setStatus("Connecting...", "disconnected");

      ws = new WebSocket(`ws://localhost:${port}/ws`, ["bearer", token]);

      ws.onopen = function() {
        setStatus("Connected", "connected");
        document.getElementById("connectBtn").textContent = "Disconnect";
        log("Connected. Subscribing to antrikan:" + channel);

        ws.send(JSON.stringify({
          type: "subscribe",
          payload: { channel_ids: ["antrikan:" + channel] }
        }));
      };

      ws.onmessage = function(e) {
        var event = JSON.parse(e.data);
        log("RECEIVED: type=" + event.type + " channel=" + event.channel_id);
        if (event.type === "queued_item_created") {
          log("  new item: slug=" + event.queued_item.id + " status=" + event.queued_item.status);
        } else if (event.type === "queued_item_updated") {
          log("  updated item: slug=" + event.queued_item.id + " status=" + event.queued_item.status);
        }
      };

      ws.onclose = function(e) {
        setStatus("Disconnected", "disconnected");
        document.getElementById("connectBtn").textContent = "Connect";
        log("Disconnected (code=" + e.code + "). Reconnecting in 2s...");
        ws = null;

        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = function(e) {
        log("ERROR: WebSocket error");
      };
    }

    // stop reconnecting on page unload
    window.addEventListener("beforeunload", function() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (ws) ws.close();
    });
  </script>
</body>
</html>
