default: &default
  ligo: &ligo
    app: &ligo_app
      cors_whitelist: "*"
      cors_ok_headers: "Content-Type, Authorization, Access-Control-Allow-Origin"

      salt_for:
        id_concealer: "salted_id_for_custy_app"

    database: &ligo_database
      host: "localhost"
      port: 3306
      name: "ligo_development"
      user: "devroot"
      password: "devroot"

    mailer:
      smtp: &mailer_smtp
        host: "mailcatcher" # LIGO_MAILER_SMTP_HOST
        port: 1025 # LIGO_MAILER_SMTP_PORT
        domain: "localhost" # LIGO_MAILER_SMTP_DOMAIN
        use_auth: true
        username: "user" # LIGO_MAILER_SMTP_USER_NAME
        password: "password" # LIGO_MAILER_SMTP_PASSWORD
        use_smtps: false # LIGO_MAILER_SMTP_USE_SMPTS
        use_starttls: false # LIGO_MAILER_SMTP_USE_STARTTLS

    s3: &ligo_s3
      region: "us-east-1"
      bucket: "ligo-uploaded-files"
      access_key: "my_access_key"
      secret_key: "my_secret_key"
      endpoint: "http://localhost:4566"
      force_path_style: true

    redis: &ligo_redis
      host: "127.0.0.1"
      port: 6379
      password: ""
      database_number: 0

    sidekiq: &ligo_sidekiq
      redis:
        host: "127.0.0.1"
        port: 6379
        password: ""
        database_number: 0
      dashboard:
        session_secret: ""
      job_status_expiry: 86400

# ------------------------------------------------------------------

production:
  <<: *default

  ligo:
    app:
      <<: *ligo_app
      cors_whitelist: "https://workaty.com, https://dashtomer.com"

    database:
      <<: *ligo_database

    mailer:
      smtp:
        <<: *mailer_smtp
        address: "sandbox.smtp.mailtrap.io"
        port: 2525
        use_auth: true
        username: "6e597f234ce69c"
        password: "65465d34f00cef"
        use_starttls: true

    s3:
      <<: *ligo_s3

    redis:
      <<: *ligo_redis

    sidekiq:
      <<: *ligo_sidekiq

# ------------------------------------------------------------------

development: &development
  <<: *default

  ligo:
    <<: *ligo

    database: &ligo_database_development
      <<: *ligo_database
      host: "127.0.0.1"
      port: 3366

    mailer:
      smtp:
        <<: *mailer_smtp
        use_auth: false

    s3:
      <<: *ligo_s3

    redis: &ligo_redis_development
      host: "127.0.0.1"
      port: 6380
      password: "devredis"
      database_number: 0

    sidekiq: &ligo_sidekiq_development
      <<: *ligo_sidekiq
      redis:
        <<: *ligo_redis_development

test:
