<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
    .container { text-align: center; background: white; padding: 48px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; }
    h1 { font-size: 1.5rem; margin: 0 0 24px; color: #333; }
    input[type="text"] { width: 200px; padding: 12px 16px; font-size: 1.2rem; text-align: center; letter-spacing: 4px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
    input[type="text"]:focus { border-color: #569aec; }
    button { margin-top: 16px; padding: 12px 32px; font-size: 1rem; background: #569aec; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #4178c7; }
    p { color: #777; margin-top: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enter verification code</h1>
    <form method="GET" action="{% url "verify_email" %}">
      <input type="text" name="code" placeholder="ABC123" maxlength="6" autocomplete="off">
      <input type="hidden" name="user" value="{{ user_hashed }}">
      {% if redirection_uri %}<input type="hidden" name="redirectionUri" value="{{ redirection_uri }}">{% endif %}
      <br>
      <button type="submit">Verify</button>
    </form>
    <p>Check your email for the verification code.</p>
  </div>
</body>
</html>
