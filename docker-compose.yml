version: "3"

services:
  custy_db:
    container_name: custy_db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data # to persist database

  custy_backend:
    container_name: custy_backend
    build:
      dockerfile: Dockerfile.dev
    command: marten serve
    # tty: true
    # stdin_open: true
    volumes:
      - ./backend:/app
      # - bundle_data:/usr/local/bundle:cached
    depends_on:
      - custy_db
    ports:
      - 3003:3000 # forward the port
    platform: linux/amd64

  custy_frontend:
    container_name: custy_frontend
    build:
      dockerfile: ./frontend/Dockerfile.dev
    volumes:
      - ./frontend:/app
    ports:
      - 3001:3000
    command: "npm run dev"

volumes:
  pgdata:
  # bundle_data:
