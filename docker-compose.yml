version: "3"

services:
  custy_db:
    container_name: custy_db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data # to persist database

  custy_backend:
    container_name: custy_backend
    build:
      dockerfile: Dockerfile.dev
    command: bundle exec rails server -b 0.0.0.0
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle:cached
    depends_on:
      - custy_db
    ports:
      - 3003:3000 # forward the port

  custy_frontend:
    container_name: custy_frontend
    build:
      dockerfile: ./frontend/Dockerfile.dev
    volumes:
      - ./frontend:/app
    ports:
      - 3001:3000
    command: "npm run dev"

# networks:
#   app_net:
#     driver: bridge
#     ipam:
#       driver: default
#       config:
#         - subnet: 127.20.0.0/24

volumes:
  pgdata:
  bundle_data:
