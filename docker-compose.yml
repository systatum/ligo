version: "3"

services:
  ligo_db:
    container_name: ligo_db
    image: mariadb:11.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ligo_db_root_password
      MYSQL_USER: ligo_db_user
      MYSQL_PASSWORD: ligo_db_password
    volumes:
        # to persist database, run docker volume rm ligo_db_data
        # if you change the startup SQL code
      - ligo_db_data:/var/lib/mysql
      - ./backend/dev_init.sql:/docker-entrypoint-initdb.d/setup.sql
    ports:
      - 3306:3306

  ligo_backend:
    container_name: ligo_backend
    restart: on-failure
    build:
      dockerfile: Dockerfile.dev
    environment:
      MARTEN_ENV: development
    command: marten serve -p 3003
    # tty: true
    # stdin_open: true
    volumes:
      - ./backend:/app
      # - bundle_data:/usr/local/bundle:cached
    depends_on:
      - ligo_db
    ports:
      - 3003:3003 # forward the port
      - 8080:8080 # for marten play

  mailcatcher:
    restart: on-failure
    image: dockage/mailcatcher:0.9.0
    ports:
      - 1025:1025
      - 1080:1080
    environment:
      MAILCATCHER_SMTP_PORT: 1025
      MAILCATCHER_HTTP_PORT: 1080

volumes:
  ligo_db_data:
  # bundle_data:
