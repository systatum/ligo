services:
  ligo_db:
    container_name: ligo_db
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ligo_db_root_password
      MYSQL_USER: ligo_db_user
      MYSQL_PASSWORD: ligo_db_password
    volumes:
        # to persist database, run docker volume rm ligo_db_data
        # if you change the startup SQL code
      - ligo_db_data:/var/lib/mysql
      - ./backend/dev_init.sql:/docker-entrypoint-initdb.d/setup.sql
    ports:
      - 3366:3306

  mailcatcher:
    restart: on-failure
    image: dockage/mailcatcher:0.9.0
    ports:
      - 1025:1025
      - 1080:1080
    environment:
      MAILCATCHER_SMTP_PORT: 1025
      MAILCATCHER_HTTP_PORT: 1080

  # for emulating S3
  localstack:
    build:
      context: ./containers/localstack
    ports:
      - "4566:4566"
    volumes:
      - ./containers/localstack/ready.sh:/etc/localstack/init/ready.d/ready.sh
      - ./tmp/localstack:/persisted-data
    environment:
      - PERSIST_DEFAULT=0
      - PERSIST_S3=1

volumes:
  ligo_db_data:
  # bundle_data:
