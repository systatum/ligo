version: "3"

services:
  custy_db:
    container_name: custy_db
    image: mariadb:11.4.4
    environment:
      MYSQL_ROOT_PASSWORD: custy_db_root_password
      MYSQL_USER: custy_db_user
      MYSQL_PASSWORD: custy_db_password
    volumes:
        # to persist database, run docker volume rm custy_custy_db_data
        # if you change the startup SQL code
      - custy_db_data:/var/lib/mysql
      - ./backend/dev_init.sql:/docker-entrypoint-initdb.d/setup.sql
    ports:
      - 3306:3306

  custy_backend:
    container_name: custy_backend
    build:
      dockerfile: Dockerfile.dev
    command: marten serve -p 3003
    # tty: true
    # stdin_open: true
    volumes:
      - ./backend:/app
      # - bundle_data:/usr/local/bundle:cached
    depends_on:
      - custy_db
    ports:
      - 3003:3003 # forward the port
      - 8080:8080 # for marten play

  custy_frontend:
    container_name: custy_frontend
    build:
      dockerfile: ./frontend/Dockerfile.dev
    volumes:
      - ./frontend:/app
    ports:
      - 3001:3000
    command: "npm run dev"

volumes:
  custy_db_data:
  # bundle_data:
